name: WCRP Plugin Tests

on:
  pull_request:
  push:

# Deny all permissions by default
permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.x"

    - name: Install netcdf-c
      run: >
        sudo apt-get update
        && sudo apt-get install netcdf-bin

    - name: Install compliance-checker
      run: |
        python -m pip install -e .[test]

    - name: cc-plugin-wcrp tests
      shell: bash -l {0}
      run: >
        git clone https://github.com/ESGF/cc-plugin-wcrp.git
        && cd cc-plugin-wcrp
        && python -m pip install -e .
        && python -m pytest -s -rxs -v tests/test_registry_units.py
