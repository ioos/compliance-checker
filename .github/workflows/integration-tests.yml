name: Integration Tests

on:
  pull_request:
  push:

# Deny all permissions by default
permissions: {}

jobs:
  run:
    name: cf-pyudunits2 ${{ matrix.pyudunits2 }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pyudunits2: [ false ]
        include:
          - pyudunits2: true
      fail-fast: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.x"

    - name: Install netcdf-c
      run: >
        sudo apt-get update
        && sudo apt-get install netcdf-bin libnetcdf-dev

    - name: Install compliance-checker
      run: |
        python -m pip install -e .[test]

    - name: Test with cf-units (optional)
      # This will run pyudunits2 only on Lunix and stable Python.
      if: matrix.pyudunits2 == true
      run: |
        pip uninstall cf-units --yes
        pip install pyudunits2

    - name: Integration Tests
      run: python -m pytest -m "integration" -s -rxs -v --vcr-record=none compliance_checker
